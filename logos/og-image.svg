<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#131829"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6c895"/>
      <stop offset="50%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#4a90e2"/>
    </linearGradient>
    <radialGradient id="g1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#4a90e2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4a90e2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- 새 워드마크 -->
  <g font-family="'Pretendard', system-ui, sans-serif">
    <text x="600" y="190" font-weight="900" font-size="100" letter-spacing="-2" text-anchor="middle">
      <tspan fill="#e8eaed">INSIGHT</tspan><tspan fill="#4a90e2" dx="20">BANK</tspan>
    </text>
    <line x1="350" y1="232" x2="540" y2="232" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
    <text x="600" y="248" font-weight="700" font-size="42" letter-spacing="22" fill="#d4a574" text-anchor="middle">HUB</text>
    <line x1="660" y1="232" x2="850" y2="232" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 메인 카피 -->
  <text x="600" y="370" font-family="'Noto Serif KR', serif" font-weight="700" font-size="56" fill="#e8eaed" text-anchor="middle">분산된 다섯 채널을</text>
  <text x="600" y="436" font-family="'Noto Serif KR', serif" font-weight="700" font-size="56" fill="url(#gold)" text-anchor="middle">하나의 인용 가능한 자산으로</text>

  <!-- 서브 -->
  <text x="600" y="486" font-family="sans-serif" font-size="22" fill="#9aa0b3" text-anchor="middle">5개 신문사 통합 · GEO-AIO 싱크탱크 · 8개 언어 글로벌</text>

  <!-- 8개 언어 깃발 -->
  <text x="600" y="565" font-family="sans-serif" font-size="38" text-anchor="middle">🇰🇷 🇺🇸 🇨🇳 🇯🇵 🇪🇸 🇫🇷 🇩🇪 🇸🇦</text>

  <!-- 우측 상단 라벨 -->
  <rect x="930" y="60" width="220" height="40" rx="20" fill="rgba(212,165,116,0.10)" stroke="#d4a574" stroke-width="1.5"/>
  <text x="1040" y="86" font-family="sans-serif" font-size="14" letter-spacing="3" text-anchor="middle" fill="#d4a574">CONFIDENTIAL · v1.0</text>
</svg>
